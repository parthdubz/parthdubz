name: Update Greeting

on:
  schedule:
    - cron: '0 * * * *'  # runs every hour
  workflow_dispatch:

jobs:
  update-greeting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update greeting in README
        run: |
          from datetime import datetime
          import pytz
          import urllib.parse
          import re

          # Nepal timezone
          tz = pytz.timezone("Asia/Kathmandu")
          hour = datetime.now(tz).hour

          # Determine greeting
          if 5 <= hour < 12:
              greeting = "Good Morning"
          elif 12 <= hour < 17:
              greeting = "Good Afternoon"
          elif 17 <= hour < 20:
              greeting = "Good Evening"
          else:
              greeting = "Good Night"

          # Add waving emoji
          greeting += " 👋"

          # URL encode for Capsule Render
          greeting_encoded = urllib.parse.quote(greeting)

          # Load README
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # Replace placeholder in Capsule Render URL
          new_content = re.sub(
              r'https://capsule-render\.vercel\.app/api\?type=waving.*?text=.*?&fontSize=60',
              f'https://capsule-render.vercel.app/api?type=waving&height=120&section=header&text={greeting_encoded}&fontSize=60',
              content
          )

          # Save README
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update greeting based on Nepal time" || echo "No changes to commit"
          git push
