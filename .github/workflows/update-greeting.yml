name: Update Dynamic Greeting

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:

jobs:
  update-greeting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update greeting in README
        run: |
          from datetime import datetime
          import pytz
          import urllib.parse
          import re

          # Nepal time
          tz = pytz.timezone("Asia/Kathmandu")
          hour = datetime.now(tz).hour

          # Determine greeting
          if 5 <= hour < 12:
              greeting = "Good Morning"
          elif 12 <= hour < 17:
              greeting = "Good Afternoon"
          elif 17 <= hour < 20:
              greeting = "Good Evening"
          else:
              greeting = "Good Night"

          # Add waving emoji
          greeting += " 👋"

          # URL encode
          greeting_encoded = urllib.parse.quote(greeting)

          # Add cache-busting timestamp
          timestamp = int(datetime.now(tz).timestamp())
          cache_param = f"?v={timestamp}"

          # Read README
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          # Replace placeholder __GREETING__ with encoded greeting + cache param
          new_content = re.sub(r'__GREETING__', f'{greeting_encoded}{cache_param}', content)

          # Write README only if changed
          if new_content != content:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("README updated")
          else:
              print("No changes needed")

      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update greeting automatically"
          git push
